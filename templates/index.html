<!DOCTYPE html>
<html lang="sr" class="h-full">
<head>
  {{template "head" .}}
</head>

<body class="h-full">
<div x-data="receiptsPage" class="flex min-h-screen flex-col">
  {{template "header" .}}

  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6 lg:px-8">
    <div class="animate-fade-in-up flex flex-col gap-1">
      <h1 class="text-2xl font-semibold tracking-tight">Računi</h1>
      <p class="text-sm text-muted-foreground">
        Svi preuzeti računi, grupisani po provajderu i periodu.
      </p>
    </div>

    <!-- Filters -->
    <section class="animate-fade-in-up mt-6 flex flex-col gap-4" style="--stagger: 1">
      <div class="flex flex-wrap items-end gap-3">
        <div class="flex min-w-[240px] flex-1 flex-col gap-1.5">
          <label for="search" class="text-sm font-medium leading-none">Pretraga</label>
          <div class="relative">
            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-muted-foreground">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                <circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" />
              </svg>
            </span>
            <input id="search" type="text" x-model.debounce.300ms="query" class="input pl-9"
                   placeholder="Provajder, period, naziv fajla..." />
          </div>
        </div>

        <div class="flex w-full flex-col gap-1.5 sm:w-44">
          <label for="period" class="text-sm font-medium leading-none">Period</label>
          <div class="relative">
            <select id="period" x-model="selectedPeriod" class="input appearance-none pr-9">
              <option value="">Svi periodi</option>
              <template x-for="per in periods" :key="per">
                <option :value="per" x-text="per"></option>
              </template>
            </select>
            <span class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-muted-foreground">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </span>
          </div>
        </div>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button type="button" @click="clearProviders()"
                :class="selectedProviders.length === 0 ? 'pill-active' : 'pill-inactive'" class="pill">
          Svi provajderi
        </button>
        <template x-for="p in providers" :key="p">
          <button type="button" @click="toggleProvider(p)"
                  :class="selectedProviders.includes(p) ? 'pill-active' : 'pill-inactive'" class="pill">
            <span x-text="p.toUpperCase()"></span>
          </button>
        </template>

        <span class="mx-1 h-5 w-px bg-border"></span>

        <template x-for="opt in paidFilters" :key="opt.value">
          <button type="button" @click="paidFilter = opt.value"
                  :class="paidFilter === opt.value ? 'pill-active' : 'pill-inactive'" class="pill">
            <span x-text="opt.label"></span>
          </button>
        </template>
      </div>
    </section>

    <div class="mt-6 flex items-center justify-between border-t pt-4 text-sm text-muted-foreground">
      <span>
        Prikazano <span class="font-medium text-foreground" x-text="filteredReceipts.length"></span>
        od <span class="font-medium text-foreground" x-text="receipts.length"></span> računa
        <span x-show="unpaidCount > 0">
          · <span class="font-medium text-warning" x-text="unpaidCount"></span> neplaćeno
        </span>
      </span>
      <button type="button" x-show="hasActiveFilters" @click="resetFilters()"
              class="btn btn-ghost h-8 px-2 text-xs">
        Poništi filtere
      </button>
    </div>

    <!-- Loading skeletons -->
    <section x-show="loading" class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      <template x-for="i in 8" :key="'skeleton-' + i">
        <div class="card animate-pulse p-5">
          <div class="h-5 w-16 rounded bg-muted"></div>
          <div class="mt-4 h-7 w-28 rounded bg-muted"></div>
          <div class="mt-2 h-4 w-20 rounded bg-muted"></div>
          <div class="mt-5 h-9 w-full rounded-md bg-muted"></div>
        </div>
      </template>
    </section>

    <!-- Empty state -->
    <section x-show="!loading && filteredReceipts.length === 0" class="mt-6">
      <div class="flex flex-col items-center justify-center rounded-xl border border-dashed px-6 py-16 text-center">
        <div class="flex h-11 w-11 items-center justify-center rounded-full bg-muted text-muted-foreground">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v5h5" />
          </svg>
        </div>
        <h3 class="mt-4 text-sm font-semibold">Nema računa</h3>
        <p class="mt-1 max-w-sm text-sm text-muted-foreground">
          Nijedan račun ne odgovara izabranim filterima. Pokušajte da promenite pretragu ili period.
        </p>
        <button type="button" x-show="hasActiveFilters" @click="resetFilters()" class="btn btn-outline mt-4">
          Poništi filtere
        </button>
      </div>
    </section>

    <!-- Receipt grid -->
    <section x-show="!loading && filteredReceipts.length > 0"
             class="mt-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      <template x-for="(item, index) in filteredReceipts" :key="item.url">
        <article class="card animate-fade-in-up flex flex-col p-5 transition-shadow hover:shadow-md"
                 :style="`--stagger: ${index}`">
          <div class="flex items-start justify-between gap-2">
            <div class="flex flex-wrap items-center gap-1.5">
              <span class="badge badge-secondary" x-text="item.provider.toUpperCase()"></span>
              {{/* Colours cross-fade via .badge's transition; the pop only fires
                   on an actual toggle, not on every re-render. */}}
              <span class="badge" :class="{ 'badge-success': item.paid, 'badge-warning': !item.paid, 'animate-pop': item.pulse }"
                    :title="item.paid ? 'Plaćeno ' + new Date(item.paid_at * 1000).toLocaleDateString('sr-Latn-RS') : 'Još nije plaćeno'">
                <svg x-show="item.paid" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="mr-1 h-3 w-3" :class="{ 'animate-check': item.pulse }">
                  <path d="M20 6 9 17l-5-5" />
                </svg>
                <svg x-show="!item.paid" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="mr-1 h-3 w-3">
                  <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
                </svg>
                <span x-text="item.paid ? 'Plaćeno' : 'Neplaćeno'"></span>
              </span>
            </div>
            <span class="shrink-0 text-xs text-muted-foreground"
                  x-text="new Date(item.modified * 1000).toLocaleDateString('sr-Latn-RS')"></span>
          </div>

          <div class="mt-4 flex-1">
            <div class="text-2xl font-semibold tracking-tight"
                 x-text="item.amount ? formatMoney(item.amount, item.currency) : '—'"></div>
            <div class="mt-1 text-sm text-muted-foreground" x-text="item.period"></div>
          </div>

          <div class="mt-4 flex items-center gap-1.5 text-xs text-muted-foreground">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-3.5 w-3.5 shrink-0">
              <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v5h5" />
            </svg>
            <span class="truncate" x-text="item.filename"></span>
            <span x-show="item.size > 0" x-text="'· ' + formatSize(item.size)"></span>
          </div>

          <div class="mt-4 flex flex-col gap-2">
            <a :href="item.url" target="_blank" rel="noopener" class="btn btn-primary w-full">
              Pogledaj račun
            </a>
            <button type="button" class="btn btn-outline w-full"
                    :disabled="saving.includes(item.url)"
                    @click="togglePaid(item)">
              <span x-show="!saving.includes(item.url)"
                    x-text="item.paid ? 'Označi kao neplaćeno' : 'Označi kao plaćeno'"></span>
              <span x-show="saving.includes(item.url)">Čuvanje...</span>
            </button>
          </div>
        </article>
      </template>
    </section>
  </main>
</div>

<script src="/assets/js/app.js"></script>
</body>
</html>
