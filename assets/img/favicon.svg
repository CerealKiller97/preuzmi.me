<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Preuzmi.me">
  <title>Preuzmi.me</title>
  <!-- Mark: a download arrow landing on a receipt's torn edge.
       "Preuzmi" is Serbian for "download", hence the arrow. -->
  <rect width="64" height="64" rx="14" fill="#18181b"/>
  <g fill="none" stroke="#fafafa" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M32 15v19"/>
    <path d="M22.5 26.5 32 36l9.5-9.5"/>
  </g>
  <!-- Torn receipt edge as the landing line -->
  <path d="M15 46.5 20.3 51 25.7 46.5 31 51 36.3 46.5 41.7 51 47 46.5"
        fill="none" stroke="#fafafa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
