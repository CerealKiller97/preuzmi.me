name: release

# Fires when scripts/release.sh pushes a vX.Y.Z tag. Builds a multi-arch image
# (amd64 + arm64), pushes it to GHCR, and opens a GitHub Release whose notes are
# the matching CHANGELOG.md section.
on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  docker:
    name: build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # keepachangelog: the release body is the CHANGELOG.md section whose
      # heading matches this tag. Runs before the build so a missing entry
      # fails fast, before the image is published.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture && $0 ~ /^\[[^][]+\]:[[:space:]]/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md entry for ${version}; add a '## [${version}]' section."
            exit 1
          fi
          echo "Release notes for ${version}:"
          echo
          cat release-notes.md

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derives the image tags/labels from the git tag: the full version, the
      # X.Y line, and a moving latest. metadata-action lowercases the image
      # name, which GHCR requires.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 🚀 ${{ github.ref_name }}
          body_path: release-notes.md
