# Local S3-compatible storage for testing `"storage": "s3"`.
#
# RustFS exposes the S3 API on :9000 and a web console on :9001. The
# `createbuckets` helper waits for the API, then creates the `receipts`
# bucket the app writes into.
#
# Point config.json at it:
#   "storage": "s3",
#   "s3": {
#     "endpoint": "http://localhost:9000",
#     "bucket": "receipts",
#     "region": "us-east-1",
#     "access_key": "rustfsadmin",
#     "secret_key": "rustfsadmin"
#   }
#
# Console: http://localhost:9001  (same credentials)
#
# Mailpit captures every message the SMTP notification driver sends, so you can
# test mail notifications without a real inbox. It listens for SMTP on :1025 and
# serves a web UI on :8025 where the captured mail shows up. No auth, no TLS.
#
# Point config.json at it:
#   "notifications": {
#     "driver": "smtp",
#     "smtp": {
#       "host": "localhost",
#       "port": 1025,
#       "from": "preuzmi@localhost",
#       "to": "you@localhost"
#     }
#   }
# Leave username/password empty. Then hit "test notification" and watch it land.
#
# Inbox: http://localhost:8025

services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    command: ["/data"]
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    restart: unless-stopped

  # One-shot: create the `receipts` bucket once RustFS is reachable, then exit.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - rustfs
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://rustfs:9000 rustfsadmin rustfsadmin; do
        echo 'waiting for rustfs...'; sleep 1;
      done;
      mc mb --ignore-existing local/receipts;
      echo 'bucket ready: receipts';
      "
    restart: "no"

  # Mail testing: captures SMTP notifications and shows them in a web inbox.
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"   # SMTP (point smtp.host/port here)
      - "8025:8025"   # web inbox
    restart: unless-stopped

volumes:
  rustfs-data:
