name: mobile build

# Produces production APK + (unsigned) IPA artifacts. Run manually, or
# automatically when a vX.Y.Z tag is pushed. On a tag the binaries are also
# attached to that tag's GitHub Release (which release.yml creates from the
# CHANGELOG); on a manual run they are only kept as workflow-run artifacts.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: false

# contents: write lets the tag runs upload the APK / IPA as Release assets.
permissions:
  contents: write

jobs:
  apk:
    name: build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Build release APK
        working-directory: apps/mobile
        run: bash scripts/build-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: preuzmi-apk
          path: apps/mobile/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # On a tag, add the APK to that version's GitHub Release. Only the assets
      # are touched (no name/body), so release.yml still owns the release notes.
      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/dist/*.apk
          fail_on_unmatched_files: true

  ipa:
    name: build release IPA (unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      # Unsigned build (no Apple certificate needed). Sideload the .ipa with
      # Sideloadly/AltStore, or set up signing + secrets for a signed build.
      - name: Build unsigned IPA
        working-directory: apps/mobile
        run: bash scripts/build-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: preuzmi-ipa
          path: apps/mobile/dist/*.ipa
          if-no-files-found: error
          retention-days: 30

      # On a tag, add the unsigned IPA to that version's GitHub Release.
      - name: Attach IPA to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/dist/*.ipa
          fail_on_unmatched_files: true
